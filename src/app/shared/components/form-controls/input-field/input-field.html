<nz-form-item>
  <nz-form-label [nzRequired]="required" [nzNoColon]="true">
    {{ label }}
  </nz-form-label>
  <nz-form-control
    [nzErrorTip]="hasError ? errorText : undefined"
    [nzValidateStatus]="hasError ? 'error' : 'success'"
  >
    @if (type === InputFieldType.Number) {
      <input nz-input type="number" [placeholder]="placeholder" [formControl]="formControl" />
    } @else {
      <input nz-input type="text" [placeholder]="placeholder" [formControl]="formControl" />
    }
    @if (hint && !hasError) {
      <small class="form-hint form-hint--italic">{{ hint }}</small>
    }
  </nz-form-control>
</nz-form-item>
